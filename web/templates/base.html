<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Web Admin" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/app.css" rel="stylesheet">
</head>
<body>
{% if admin %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/admin">VPN Admin</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/admin">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/servers">Серверы</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/tariffs">Тарифы</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/users">Пользователи</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/keys">Ключи</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/payments">Платежи</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/settings">Настройки</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/system">Система</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/audit">Аудит</a></li>
      </ul>
      <span class="navbar-text me-3">{{ admin.username }}</span>
      <a class="btn btn-outline-light btn-sm" href="/logout">Выход</a>
    </div>
  </div>
</nav>
{% endif %}

<main class="container-fluid py-4">
  {% for flash in flashes %}
  <div class="alert alert-{{ flash.category }} alert-dismissible fade show" role="alert">
    {{ flash.message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
