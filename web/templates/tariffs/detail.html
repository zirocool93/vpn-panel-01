{% extends "base.html" %}
{% block content %}
{% if not tariff %}<div class="alert alert-warning">Тариф не найден</div>{% else %}
<div class="d-flex justify-content-between"><h1 class="h3">{{ tariff.name }}</h1><a class="btn btn-outline-secondary" href="/admin/tariffs/{{ tariff.id }}/edit">Редактировать</a></div>
<pre class="bg-light p-3">{{ tariff }}</pre>
{% endif %}
{% endblock %}
