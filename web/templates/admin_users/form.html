{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3">{{ title }}</h1>
  <a class="btn btn-outline-secondary" href="{{ '/admin/admin-users/' ~ target.id if target else '/admin/admin-users' }}">Назад</a>
</div>
<form method="post" class="row g-3">
  <div class="col-md-6"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ target.username if target else '' }}" required></div>
  <div class="col-md-4"><label class="form-label">Role</label><select class="form-select" name="role">{% for r in roles %}<option value="{{ r.role_key }}" {% if target and target.role == r.role_key %}selected{% endif %}>{{ r.label }}</option>{% endfor %}</select></div>
  <div class="col-md-2 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" name="is_active" value="1" id="is_active" {% if not target or target.is_active %}checked{% endif %}><label class="form-check-label" for="is_active">Активен</label></div></div>
  {% if not target %}
  <div class="col-md-6"><label class="form-label">Password</label><input class="form-control" name="password" type="password" minlength="10" required></div>
  <div class="col-md-6"><label class="form-label">Confirm password</label><input class="form-control" name="confirm_password" type="password" minlength="10" required></div>
  {% endif %}
  <div class="col-12"><button class="btn btn-primary">Сохранить</button></div>
</form>
{% endblock %}
