{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3">Роли</h1>
  <a class="btn btn-outline-secondary" href="/admin/admin-users">Админы</a>
</div>
<div class="table-responsive">
  <table class="table table-sm"><thead><tr><th>Role</th><th>Label</th><th>Active</th><th>Permissions</th><th></th></tr></thead><tbody>
  {% for role in roles %}
  <tr><td><code>{{ role.role_key }}</code></td><td>{{ role.label }}</td><td>{{ role.is_active }}</td><td>{{ role.permissions|length }}</td><td class="text-end"><a class="btn btn-sm btn-outline-primary" href="/admin/admin-users/roles/{{ role.role_key }}">Права</a></td></tr>
  {% endfor %}
  </tbody></table>
</div>
{% endblock %}
