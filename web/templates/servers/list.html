{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">Серверы</h1><a class="btn btn-primary" href="/admin/servers/new">Добавить</a></div>
<table class="table table-hover"><tr><th>ID</th><th>Название</th><th>Адрес</th><th>Protocol</th><th>Активен</th><th></th></tr>
{% for s in servers %}
<tr>
  <td>{{ s.id }}</td><td><a href="/admin/servers/{{ s.id }}">{{ s.name }}</a></td><td>{{ s.host }}:{{ s.port }}</td><td>{{ s.protocol }}</td><td>{{ "да" if s.is_active else "нет" }}</td>
  <td class="text-end">
    <a class="btn btn-sm btn-outline-secondary" href="/admin/servers/{{ s.id }}/edit">Edit</a>
    <form class="d-inline" method="post" action="/admin/servers/{{ s.id }}/toggle"><button class="btn btn-sm btn-outline-warning">Toggle</button></form>
  </td>
</tr>
{% endfor %}
</table>
{% endblock %}
