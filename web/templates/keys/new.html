{% extends "base.html" %}
{% block content %}
<h1 class="h3">Создать VPN-ключ</h1>
<form method="post" action="/admin/keys/new" class="vstack gap-3">
  <div>
    <label class="form-label">Пользователь</label>
    <select class="form-select" name="user_id" required>
      {% for user in options.users %}
      <option value="{{ user.id }}" {% if selected_user_id == user.id %}selected{% endif %}>{{ user.username or user.telegram_id }} (#{{ user.id }})</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="form-label">Тариф</label>
    <select class="form-select" name="tariff_id" required>
      {% for tariff in options.tariffs %}
      <option value="{{ tariff.id }}">{{ tariff.name }} — {{ tariff.duration_days }} дн., {{ tariff.traffic_limit_gb or 0 }} ГБ</option>
      {% endfor %}
    </select>
  </div>
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Сервер</label>
      <select class="form-select" name="server_id">
        <option value="">Автоматически</option>
        {% for server in options.servers %}
        <option value="{{ server.id }}">{{ server.name }} ({{ server.host }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Inbound ID</label>
      <input class="form-control" name="inbound_id" type="number" min="1" placeholder="пусто = авто/subscription">
    </div>
  </div>
  <div>
    <label class="form-label">Название</label>
    <input class="form-control" name="custom_name" maxlength="30">
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="create_on_panel" value="1" id="create_on_panel" checked>
    <label class="form-check-label" for="create_on_panel">Создать/синхронизировать на панели 3X-UI</label>
  </div>
  <div><button class="btn btn-primary">Создать ключ</button></div>
</form>
{% endblock %}
